# =================================================================
# HYPRLAND — legacy .conf fallback
#
# The real config is hyprland.lua. Hyprland looks for hyprland.lua first and
# only falls back to this file, so as long as the Lua config is in place this
# whole tree is inert.
#
# It is kept because Hyprland 0.56 still reads it: rename or delete
# hyprland.lua and the session comes straight back up on the old .conf setup,
# exactly as it was before the migration. 0.57 drops .conf support entirely,
# at which point this is only a reference.
# =================================================================

source = $HOME/.config/hypr/legacy-conf/hyprland.conf
