# Default apps and the rofi search engine.
#
# The one .conf file that did not move to hypr/legacy-conf/ with the Lua
# migration, because four things read it: hypr/lua/apps.lua parses it for
# $term / $files / $browser, RofiSearch.sh wants $Search_Engine,
# Kool_Quick_Settings.sh offers it for editing, and the legacy .conf fallback
# still sources it. It stays the single place these are named.
#
# The `env =` line below is only read on the .conf fallback path -- under the
# Lua config, environment variables are set in hypr/lua/env.lua.

# Set your default editor here uncomment and reboot to take effect.
# NOTE, this will be automatically uncommented if you select neovim or vim to your default editor
env = EDITOR,nvim #default editor

# Define preferred text editor for the KooL Quick Settings Menu (SUPER SHIFT E)
# script will take the default EDITOR and nano as fallback
$edit=${EDITOR:-nano}

# These two are for UserKeybinds.conf & Waybar Modules
$term = kitty # Terminal
$files = kitty --class yazi -e yazi # File Manager

$browser = google-chrome-stable # Default browser

# Default Search Engine for ROFI Search (SUPER S)
$Search_Engine = "https://www.google.com/search?q={}"