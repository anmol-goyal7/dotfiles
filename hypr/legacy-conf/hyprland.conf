# NOTE: superseded by ../hyprland.lua. Reached only through the shim in
# ../hyprland.conf, and only when hyprland.lua is not there.
# =================================================================
# HYPRLAND — Main Config
# =================================================================

$mainMod     = SUPER
$configs     = $HOME/.config/hypr/legacy-conf/configs
$UserConfigs = $HOME/.config/hypr/legacy-conf/UserConfigs

# Monitor
monitor = eDP-1, preferred, auto, 1.66666666666666666666

# =================================================================
# SOURCING
# =================================================================
source = $configs/Keybinds.conf
source = $UserConfigs/Startup_Apps.conf
source = $UserConfigs/ENVariables.conf
source = $UserConfigs/Laptops.conf
source = $UserConfigs/LaptopDisplay.conf
source = $UserConfigs/WindowRules.conf
source = $UserConfigs/UserDecorations.conf
source = $UserConfigs/UserAnimations.conf
source = $UserConfigs/UserKeybinds.conf
source = $UserConfigs/UserSettings.conf
# 01-UserDefaults.conf did not move: hypr/lua/apps.lua and three shell scripts
# still read it, so it stays the one place default apps are named.
source = $HOME/.config/hypr/UserConfigs/01-UserDefaults.conf
source = $HOME/.config/hypr/legacy-conf/monitors.conf
source = $HOME/.config/hypr/legacy-conf/workspaces.conf
