# /* ---- 💫 Idle ladder — OLED-safe, and it always comes back 💫 ---- */

general {
    lock_cmd = lock
    before_sleep_cmd = dpms on; loginctl lock-session
    after_sleep_cmd = screen-wake
    ignore_dbus_inhibit = false
}

# ---- why this file stopped bricking the laptop ------------------------------
# THE BUG: leaving the laptop alone gave you a black screen that no key, no
# lid, and no touchpad could bring back — only the power button. Two causes,
# both here.
#
# 1. `hl.dsp.dpms("on")` DOES NOT TURN THE SCREEN ON. On 0.56.2 the Lua bridge
#    ignores the argument and always TOGGLES — dpms("on"), dpms("off"),
#    dpms(false) and dpms("on", "eDP-1") all do the same thing. So the ladder
#    blanked the screen at 5 min with dpms("off") (a toggle, correct by luck),
#    and then on the way back BOTH the listener's on-resume AND after_sleep_cmd
#    fired dpms("on"): two toggles, on and straight back off. Dark panel, and
#    hyprlock already holding the session lock so nothing could reach the
#    compositor. `bin/dpms on|off` reads the real state and only toggles when
#    it differs, so it is actually idempotent. Nothing here calls the raw
#    dispatcher any more. (The pre-0.56 `hyprctl dispatch dpms on` string form
#    is dead too — Lua parse error — so it was never a working fallback.)
#
# 2. LOCK BEFORE DPMS-OFF. This used to blank at 300s and only lock at 330s,
#    which starts hyprlock onto an output that is already dark. hyprlock takes
#    the ext-session-lock as soon as it starts, and the protocol says a
#    compositor whose lock client dies MUST keep painting black and keep
#    swallowing input — so a hyprlock that fell over rendering to a blanked
#    output left exactly the same unrecoverable screen. The lock now lands at
#    270s while the panel is lit, with 30s to commit a frame before anything
#    turns off, and `before_sleep_cmd` turns DPMS back on before it locks:
#    never hand hyprlock a dark output, never enter S3 with the CRTC off.
#
# `lock` is bin/lock — hyprlock, supervised, so a crash re-attaches a lock
# surface instead of leaving a dead one. `screen-wake` is bin/screen-wake,
# which undoes all three ways the screen can be left dark (DPMS off, backlight
# still dimmed, orphaned session lock). If this ever wedges again:
# Ctrl+Alt+F2, log in, `screen-wake`, Ctrl+Alt+F1.
#
# The dim step sets 10%, not raw 10. On this 400-step backlight raw 10 is 2.5%
# — indistinguishable from a dead panel, so a failed `brightnessctl -r` looked
# exactly like the hang above. 10% still saves the power and still lets you
# see enough to fix things.
#
# ---- how `afk` interacts with this file -------------------------------------
# `afk 9h` (dotfiles/bin/afk) keeps the laptop awake for a window. It used to do
# that by holding a logind *idle* inhibitor, but hypridle checks inhibitors
# before anything else and skips the whole rule -- "Ignoring from onIdled(),
# inhibit locks: 1" -- so dpms-off was suppressed along with everything else and
# this OLED panel sat lit on a static desktop for the entire window.
#
# afk now inhibits only sleep + lid. The three listeners that afk is actually
# meant to suppress opt out individually via condition_cmd instead:
#   `afk __idle-ok` -> exit 0 when no window is live (run the listener)
#                   -> exit 1 while afk is on      (skip it)
# condition_retry re-checks every 60s, so the dim -> lock -> suspend ladder
# still resumes by itself once the window expires, even if you never came back.
#
# The `[ $? -eq 1 ]` guard matters: hypridle blocks the listener on ANY non-zero
# condition_cmd exit, exit 127 included. Without the guard, `afk` merely falling
# off hypridle's PATH would silently stop the laptop ever locking or suspending
# again. Only a definitive exit 1 blocks; anything else fails open to the normal
# ladder. Verified against hypridle 0.1.8 (exit 0 -> run, 1 -> skip, 127 -> skip).
#
# The dpms-off listener deliberately has NO condition_cmd. The screen always
# blanks. That is the one thing that protects the panel, and afk must not
# override it. dbus/wayland inhibits are untouched, so video playback still
# holds the screen on exactly as before.
# -----------------------------------------------------------------------------

# 1. Dim screen (2.5 min)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
    condition_cmd = afk __idle-ok 2>/dev/null; [ $? -eq 1 ] && exit 1; exit 0
    condition_retry = 60
}

# 2. Lock (4.5 min) — while the panel is still lit, 30s before it goes dark
listener {
    timeout = 270
    on-timeout = loginctl lock-session
    condition_cmd = afk __idle-ok 2>/dev/null; [ $? -eq 1 ] && exit 1; exit 0
    condition_retry = 60
}

# 3. Turn off screen (5 min) — GPU stops rendering, OLED pixels go fully dark.
#    No condition_cmd on purpose: this must still fire during afk.
listener {
    timeout = 300
    on-timeout = dpms off
    on-resume = screen-wake
}

# 4. Suspend (10 min)
listener {
    timeout = 600
    on-timeout = systemctl suspend
    condition_cmd = afk __idle-ok 2>/dev/null; [ $? -eq 1 ] && exit 1; exit 0
    condition_retry = 60
}
