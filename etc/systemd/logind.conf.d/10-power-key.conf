# =============================================================================
# Tapping the power button must not shut the laptop down.
# Install: sudo install -Dm644 \
#            ~/repos/dotfiles/etc/systemd/logind.conf.d/10-power-key.conf \
#            /etc/systemd/logind.conf.d/10-power-key.conf
#          then reboot (logind has no ExecReload, and restarting it under a
#          running Hyprland can take libseat's session down with it)
# =============================================================================
# The default is HandlePowerKey=poweroff. The instinctive thing to do at a
# screen that will not wake is to tap power — which cleanly powers the machine
# off and loses whatever was open. That was the "force shutdown" half of the
# black-screen bug; see hypr/hypridle.conf for the other half.
#
# Waking from S3 is an ACPI/firmware job and happens on the keypress regardless
# of what logind does with it, so ignoring the short press costs nothing: the
# machine still wakes, it just no longer shuts down while doing it.
#
# Deliberate shutdown: CTRL+ALT+P (wlogout), or `poweroff` at a prompt.
# The long-press entry is only a backstop — logind's threshold is 5s and this
# firmware hard-cuts around 4s, so it may never actually fire.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
